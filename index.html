<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Fable 5 — Complete System Prompt</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    line-height: 1.6;
  }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1.5rem 6rem;
  }
  a { color: #58a6ff; }
  h1, h2, h3, h4 { color: #e6edf3; line-height: 1.3; }
  h1 { border-bottom: 1px solid #30363d; padding-bottom: .5rem; }
  h2 { border-bottom: 1px solid #21262d; padding-bottom: .3rem; margin-top: 2rem; }
  code {
    background: #161b22;
    border-radius: 4px;
    padding: .15em .4em;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: .9em;
  }
  pre {
    background: #161b22;
    border-radius: 6px;
    padding: 1rem;
    overflow-x: auto;
  }
  pre code { background: none; padding: 0; }
  blockquote {
    border-left: 4px solid #30363d;
    margin: 0;
    padding: .2rem 1rem;
    color: #8b949e;
  }
  hr { border: none; border-top: 1px solid #21262d; margin: 2rem 0; }
  header .source {
    font-size: .85rem;
    color: #8b949e;
    margin-bottom: 2rem;
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Claude Fable 5 — Complete System Prompt</h1>
    <p class="source">Source file: <a href="./full-system-prompt.md">full-system-prompt.md</a> (raw markdown)</p>
  </header>
  <article id="content">Loading…</article>
</main>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.5/dist/purify.min.js"></script>
<script>
  fetch('./full-system-prompt.md')
    .then(r => {
      if (!r.ok) throw new Error('Failed to load markdown: ' + r.status);
      return r.text();
    })
    .then(md => {
      document.getElementById('content').innerHTML = DOMPurify.sanitize(marked.parse(md));
    })
    .catch(err => {
      document.getElementById('content').textContent = err.message;
    });
</script>
</body>
</html>
